name: One-time lead business ID repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-lead-business-id-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Repair lead business ID handling
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = 'leads.js';
          let s = fs.readFileSync(target, 'utf8');

          const oldCreate = `  async createLead(lead) {\n    const userId = await this.getCurrentUserId();\n    const payload = this.cleanLeadUuidPayload({\n      ...this.backendLead(lead),`;
          const newCreate = `  async createLead(lead) {\n    const userId = await this.getCurrentUserId();\n    const leadWithBusinessId = {\n      ...(lead && typeof lead === 'object' ? lead : {}),\n      lead_id: String(lead?.lead_id || '').trim() || this.generateLeadId()\n    };\n    const payload = this.cleanLeadUuidPayload({\n      ...this.backendLead(leadWithBusinessId),`;
          if (!s.includes(oldCreate)) throw new Error('Expected createLead block not found');
          s = s.replace(oldCreate, newCreate);

          const oldSubmit = `        const tempLeadId = this.generateLeadId();\n        if (E.leadFormLeadId) E.leadFormLeadId.value = tempLeadId;\n        const created = await this.createLead(lead);`;
          const newSubmit = `        const tempLeadId = String(lead.lead_id || '').trim() || this.generateLeadId();\n        lead.lead_id = tempLeadId;\n        if (E.leadFormLeadId) E.leadFormLeadId.value = tempLeadId;\n        const created = await this.createLead(lead);`;
          if (!s.includes(oldSubmit)) throw new Error('Expected create submit block not found');
          s = s.replace(oldSubmit, newSubmit);

          const oldSource = `      const sourceLead = this.normalizeLead(await this.getLead(leadUuid));`;
          const newSource = `      let sourceLead = this.normalizeLead(await this.getLead(leadUuid));`;
          if (!s.includes(oldSource)) throw new Error('Expected sourceLead declaration not found');
          s = s.replace(oldSource, newSource);

          const oldMissing = `      if (!String(sourceLead.lead_id || '').trim()) {\n        UI.toast('Unable to convert lead: missing business Lead ID.');\n        return;\n      }`;
          const newMissing = `      if (!String(sourceLead.lead_id || '').trim()) {\n        const generatedLeadId = this.generateLeadId();\n        const repairedLeadResult = await this.updateLeadWithVerification(leadUuid, {\n          ...sourceLead,\n          lead_id: generatedLeadId\n        });\n        sourceLead = this.normalizeLead(repairedLeadResult?.row || await this.getLead(leadUuid));\n        if (!String(sourceLead.lead_id || '').trim()) {\n          throw new Error('Lead business ID could not be generated.');\n        }\n        this.upsertLocalRow(sourceLead);\n      }`;
          if (!s.includes(oldMissing)) throw new Error('Expected missing Lead ID guard not found');
          s = s.replace(oldMissing, newMissing);

          fs.writeFileSync(target, s);

          const testPath = 'tests/lead-business-id.test.js';
          const test = `const assert = require('assert');\nconst fs = require('fs');\n\nconst leads = fs.readFileSync('leads.js', 'utf8');\n\nassert.match(leads, /leadWithBusinessId[\\s\\S]*lead_id: String\\(lead\\?\\.lead_id \\|\\| ''\\)\\.trim\\(\\) \\|\\| this\\.generateLeadId\\(\\)/, 'createLead must defensively generate a business Lead ID');\nassert.match(leads, /const tempLeadId = String\\(lead\\.lead_id \\|\\| ''\\)\\.trim\\(\\) \\|\\| this\\.generateLeadId\\(\\);[\\s\\S]*lead\\.lead_id = tempLeadId;/, 'create form path must put generated Lead ID into the payload');\nassert.match(leads, /if \\(!String\\(sourceLead\\.lead_id \\|\\| ''\\)\\.trim\\(\\)\\) \\{[\\s\\S]*generatedLeadId[\\s\\S]*updateLeadWithVerification[\\s\\S]*lead_id: generatedLeadId/, 'conversion must repair historical leads missing a business Lead ID');\nassert.doesNotMatch(leads, /UI\\.toast\\('Unable to convert lead: missing business Lead ID\\.'\\)/, 'conversion must not stop solely because an older lead lacks lead_id');\n\nconsole.log('lead business ID regression tests passed');\n`;
          fs.writeFileSync(testPath, test);
          NODE
      - name: Validate lead fix
        run: |
          node --check leads.js
          node tests/lead-business-id.test.js
          npm ci
          npm test
      - name: Commit lead fix
        run: |
          git config user.name 'incheckdev-glitch'
          git config user.email 'incheckdev@gmail.com'
          git add leads.js tests/lead-business-id.test.js
          git commit -m 'fix: guarantee lead business IDs for deal conversion'
          git push origin HEAD:main
