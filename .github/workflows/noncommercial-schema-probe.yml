name: Non-Commercial Schema Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/noncommercial-schema-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Probe PostgREST schema contracts
        shell: bash
        run: |
          node <<'NODE'
          const base = String(process.env.TEST_SUPABASE_URL || '').replace(/\/+$/, '');
          const key = process.env.TEST_SUPABASE_SERVICE_ROLE_KEY || '';
          if (!base || !key) throw new Error('Supabase production test secrets are required');
          const response = await fetch(`${base}/rest/v1/`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              Accept: 'application/openapi+json',
            },
          });
          if (!response.ok) throw new Error(`OpenAPI schema HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`);
          const spec = await response.json();
          const defs = spec.definitions || spec.components?.schemas || {};
          for (const table of ['tickets','events','csm_activities','communication_centre_messages']) {
            const def = defs[table] || {};
            const props = Object.keys(def.properties || {}).sort();
            const required = Array.isArray(def.required) ? def.required : [];
            console.log(`${table}: columns=${props.join(',')}`);
            console.log(`${table}: required=${required.join(',') || '(none declared)'}`);
          }
          NODE
