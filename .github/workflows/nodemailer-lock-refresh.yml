name: Nodemailer Lock Refresh

on:
  push:
    branches:
      - security/nodemailer9
    paths:
      - 'package.json'
      - 'supabase/functions/send-email/index.ts'
      - '.github/workflows/nodemailer-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: security/nodemailer9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Validate install
        run: npm ci --ignore-scripts

      - name: Show dependency versions and audit
        run: |
          npm ls nodemailer jws ws --all
          npm audit --audit-level=high

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh secure dependency lockfile'
          git push origin HEAD:security/nodemailer9
