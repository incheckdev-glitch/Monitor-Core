name: One-time Friendly ID Production Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-release-friendly-ids.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply release cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '/leads.js?v=20260626-lead-detail-drawer': '/leads.js?v=20260817-friendly-commercial-ids-v1',
            '/deals.js?v=20260608-company-options-fresh': '/deals.js?v=20260817-friendly-commercial-ids-v1',
            '/proposals.js?v=20260814-clean-master': '/proposals.js?v=20260817-friendly-commercial-ids-v1',
            '/supabase-data.js?v=20260728-agreement-annex-extra-location-v31': '/supabase-data.js?v=20260817-friendly-commercial-ids-v1',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing cache marker: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Validate release
        run: |
          node --check leads.js
          node --check deals.js
          node --check proposals.js
          node --check supabase-data.js
          node tests/friendly-commercial-ids.test.js
          node tests/lead-business-id.test.js
          node tests/lead-deal-converter-uuid.test.js
          node tests/proposal-item-identity.test.js
          grep -Fq '/leads.js?v=20260817-friendly-commercial-ids-v1' index.html
          grep -Fq '/deals.js?v=20260817-friendly-commercial-ids-v1' index.html
          grep -Fq '/proposals.js?v=20260817-friendly-commercial-ids-v1' index.html
          grep -Fq '/supabase-data.js?v=20260817-friendly-commercial-ids-v1' index.html
          git diff --check

      - name: Commit release and remove one-time workflow
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git rm .github/workflows/one-time-release-friendly-ids.yml
          git add index.html
          git commit -m "release: activate friendly commercial IDs"
          git push origin main
