# Retry after cache-version regression correction.
name: One-time Fix Client And Commission Delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-client-and-commission-delete.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch runtime compatibility
        shell: python
        run: |
          from pathlib import Path

          p = Path('clients-service.js')
          text = p.read_text(encoding='utf-8')
          old = "'status','company_id','source_agreement_id','total_agreements','total_locations','total_value','total_paid','total_due','created_by','updated_by'"
          new = "'status','source_agreement_id','total_agreements','total_locations','total_value','total_paid','total_due','created_by','updated_by'"
          if old not in text:
              raise SystemExit('Expected stale clients company_id column entry not found')
          text = text.replace(old, new, 1)
          old = "      company_id: input.company_id || input.companyId || input.customer_company_id || input.customerCompanyId || input.client_company_id || input.clientCompanyId,\n"
          if old not in text:
              raise SystemExit('Expected stale clients company_id payload not found')
          text = text.replace(old, '', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('commission-tracker.js')
          text = p.read_text(encoding='utf-8')
          old = "const {error}=await this.db().from('sales_commissions').delete().eq('id',id);if(error){this.toast(error.message);return;}"
          new = "const {data,error}=await this.db().rpc('delete_sales_commission',{p_commission_id:id});if(error){this.toast(error.message||'Unable to delete commission record.');return;}if(data!==true){this.toast('Commission record was not deleted.');return;}"
          if old not in text:
              raise SystemExit('Expected raw commission delete not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_client = '/clients-service.js?v=20260427-allpwa1'
          old_commission = '/commission-tracker.js?v=20260817-salesperson-profile-fix-v37'
          if old_client not in text or old_commission not in text:
              raise SystemExit('Expected browser cache keys not found')
          text = text.replace(old_client, '/clients-service.js?v=20260817-client-schema-fix-v2', 1)
          text = text.replace(old_commission, '/commission-tracker.js?v=20260817-delete-rpc-v38', 1)
          p.write_text(text, encoding='utf-8')

      - name: Focused regression
        run: node tests/client-commission-runtime-compatibility.test.js

      - name: Full validation
        run: npm run check

      - name: Commit tested fix and remove helper
        run: |
          rm -f .github/workflows/one-time-fix-client-and-commission-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients-service.js commission-tracker.js index.html .github/workflows/one-time-fix-client-and-commission-delete.yml
          git commit -m "fix: repair client create and commission delete"
          git push origin HEAD:main
