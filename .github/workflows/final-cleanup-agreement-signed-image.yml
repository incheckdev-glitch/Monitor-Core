name: Final Cleanup Agreement Signed Image Helpers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-cleanup-agreement-signed-image.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove temporary helper files
        run: |
          rm -f .github/scripts/patch-agreement-signed-image-upload.py
          rm -f .github/workflows/one-time-fix-agreement-signed-image-upload.yml
          rm -f .github/workflows/cleanup-agreement-signed-image-upload-marker.txt
          rm -f .github/scripts/delete-temp-files-placeholder.txt
          rm -f .github/workflows/final-cleanup-agreement-signed-image.yml
      - name: Commit cleanup
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove signed agreement image one-time helpers"
          git push origin HEAD:main
