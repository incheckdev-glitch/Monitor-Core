name: One-time retire onboarding E2E cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-retire-onboarding-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Remove retired Operations Onboarding from production E2E
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = 'scripts/production-write-e2e.js';
          let s = fs.readFileSync(target, 'utf8');

          function removeExact(text, label) {
            if (!s.includes(text)) throw new Error(`Missing expected ${label}`);
            s = s.replace(text, '');
          }

          removeExact("  onboarding: null,\n", 'created.onboarding slot');
          removeExact("    created.onboarding?.id, created.onboarding?.onboarding_id,\n", 'notification onboarding refs');
          removeExact("  if (created.onboarding?.id) {\n    await attempt('operations_onboarding', () => safeDelete('operations_onboarding', 'id', created.onboarding.id));\n  }\n\n", 'onboarding cleanup');
          removeExact("    created.onboarding?.id,\n", 'lifecycle onboarding ref');

          const block = /\n  created\.onboarding = asRow\(await dispatch\('invoices', 'create_operations_onboarding', \{[\s\S]*?\n  pass\('Create Operations Onboarding from Invoice',[^\n]*\);\n/;
          if (!block.test(s)) throw new Error('Missing expected onboarding creation block');
          s = s.replace(block, '\n');

          if (/create_operations_onboarding|created\.onboarding|Create Operations Onboarding from Invoice/.test(s)) {
            throw new Error('Retired onboarding reference remains in production-write-e2e.js');
          }
          fs.writeFileSync(target, s);

          const testFile = 'tests/technical-admin-ui-removal.test.js';
          let t = fs.readFileSync(testFile, 'utf8');
          if (!t.includes("const productionWriteE2e = read('scripts/production-write-e2e.js');")) {
            t = t.replace(
              "const notifications = read('notifications.js');\n",
              "const notifications = read('notifications.js');\nconst productionWriteE2e = read('scripts/production-write-e2e.js');\n"
            );
          }
          const assertion = "assert.doesNotMatch(productionWriteE2e, /create_operations_onboarding|created\\.onboarding|Create Operations Onboarding/, 'production write E2E must not create or require retired Operations Onboarding');\n";
          if (!t.includes(assertion)) {
            t = t.replace(
              "assert.strictEqual(fs.existsSync('operations-onboarding.js'), false, 'standalone Operations Onboarding frontend module must remain removed');\n",
              "assert.strictEqual(fs.existsSync('operations-onboarding.js'), false, 'standalone Operations Onboarding frontend module must remain removed');\n" + assertion
            );
          }
          fs.writeFileSync(testFile, t);
          NODE
      - name: Validate cleanup
        run: |
          node --check scripts/production-write-e2e.js
          node tests/technical-admin-ui-removal.test.js
          npm ci
          npm test
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'incheckdev-glitch'
          git config user.email 'incheckdev@gmail.com'
          git add scripts/production-write-e2e.js tests/technical-admin-ui-removal.test.js
          git commit -m 'test: remove retired onboarding from production journey'
          git push origin HEAD:main
