name: One-time Friendly Commercial IDs v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-friendly-commercial-ids-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply friendly ID patch
        run: |
          awk '/node <<'"'"'NODE'"'"'/{flag=1;next} flag && /^[[:space:]]*NODE[[:space:]]*$/{exit} flag{sub(/^          /,"");print}' .github/workflows/one-time-friendly-commercial-ids-v2.yml > /tmp/friendly-id-patch.js
          node /tmp/friendly-id-patch.js

          node <<'NODE'
          const fs = require('fs');

          // The older Lead regression asserted the implementation detail generateLeadId().
          // Keep the intent (a defensive business ID) but assert the new DB-aware allocator.
          const leadTestPath = 'tests/lead-business-id.test.js';
          let leadTest = fs.readFileSync(leadTestPath, 'utf8');
          leadTest = leadTest.replace(
            /assert\.match\(leads, \/leadWithBusinessId\[\\s\\S\]\*lead_id: String\\\(lead\\\?\\\.lead_id \\\|\\\| ''\\\)\\\.trim\\\(\\\) \\\|\\\| this\\\.generateLeadId\\\(\\\)\/, 'createLead must defensively generate a business Lead ID'\);/,
            "assert.match(leads, /leadWithBusinessId[\\s\\S]*lead_id: String\\(lead\\?\\.lead_id \\|\\| ''\\)\\.trim\\(\\) \\|\\| await this\\.allocateLeadId\\(\\)/, 'createLead must defensively allocate a friendly business Lead ID');"
          );
          leadTest = leadTest.replace(
            /assert\.match\(leads, \/const tempLeadId = String\\\(lead\\\.lead_id \\\|\\\| ''\\\)\\\.trim\\\(\\\) \\\|\\\| this\\\.generateLeadId\\\(\\\);\[\\s\\S\]\*lead\\\.lead_id = tempLeadId;\/, 'create form path must put generated Lead ID into the payload'\);/,
            "assert.match(leads, /const tempLeadId = String\\(lead\\.lead_id \\|\\| ''\\)\\.trim\\(\\) \\|\\| await this\\.allocateLeadId\\(\\);[\\s\\S]*lead\\.lead_id = tempLeadId;/, 'create form path must put the allocated friendly Lead ID into the payload');"
          );
          if (!leadTest.includes('allocateLeadId')) throw new Error('Lead business ID regression was not updated');
          fs.writeFileSync(leadTestPath, leadTest);

          // At final Proposal creation, allocate from persisted DB state even if the open form
          // already shows a friendly preview ID. This avoids stale-page duplicate IDs.
          const proposalsPath = 'proposals.js';
          let proposals = fs.readFileSync(proposalsPath, 'utf8');
          const oldCreateAllocation = `    const suppliedId = String(proposal?.proposal_id || '').trim();\n    const friendlyId = /^Proposal#\\d+$/i.test(suppliedId) ? suppliedId : await this.allocateProposalId();`;
          const newCreateAllocation = `    const friendlyId = await this.allocateProposalId();`;
          if (!proposals.includes(oldCreateAllocation)) throw new Error('Proposal final allocation marker not found');
          proposals = proposals.replace(oldCreateAllocation, newCreateAllocation);
          fs.writeFileSync(proposalsPath, proposals);

          const friendlyTestPath = 'tests/friendly-commercial-ids.test.js';
          let friendlyTest = fs.readFileSync(friendlyTestPath, 'utf8');
          friendlyTest = friendlyTest.replace(
            "assert.ok(proposals.includes('proposal_id: friendlyId'), 'Proposal create must set the friendly ID');",
            "assert.ok(proposals.includes('const friendlyId = await this.allocateProposalId();'), 'Proposal create must allocate from persisted state at save time');\nassert.ok(proposals.includes('proposal_id: friendlyId'), 'Proposal create must set the friendly ID');"
          );
          fs.writeFileSync(friendlyTestPath, friendlyTest);
          NODE

      - name: Validate changes
        run: |
          node --check leads.js
          node --check deals.js
          node --check proposals.js
          node tests/friendly-commercial-ids.test.js
          node tests/lead-business-id.test.js
          npm ci
          npm run check

      - name: Commit standardization
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git add leads.js deals.js proposals.js database/bootstrap/12_gap_safe_business_id_allocation.sql tests/friendly-commercial-ids.test.js tests/lead-business-id.test.js
          git commit -m "fix: use friendly commercial business IDs"
          git push origin main
