name: One-time Fix Deal Empty UUID

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-deal-empty-uuid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch Deal UUID handling
        run: python3 .github/scripts/patch-deal-empty-uuid.py
      - name: Focused validation
        run: |
          node --check deals.js
          node tests/deal-empty-uuid.test.js
      - name: Full validation
        run: npm run check
      - name: Commit fix
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git add deals.js index.html tests/deal-empty-uuid.test.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize empty deal UUID fields"
          git push origin HEAD:main
