name: Fix Agreement Signatory Alias

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-agreement-signatory-alias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove invalid agreement DB alias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase-data.js')
          source = path.read_text()

          start = source.index('const AGREEMENT_COLUMNS = new Set([')
          end = source.index(']);', start)
          block = source[start:end]
          before_block = block
          block = block.replace("'customer_signatory_Name',", '', 1)
          if block == before_block:
              raise SystemExit('AGREEMENT_COLUMNS mixed-case alias was not found')
          source = source[:start] + block + source[end:]

          bad_assignment = '    sanitized.customer_signatory_Name = sanitized.customer_signatory_name;\n'
          if bad_assignment not in source:
              raise SystemExit('Agreement sanitizer mixed-case assignment was not found')
          source = source.replace(bad_assignment, '', 1)

          path.write_text(source)
          PY

      - name: Verify targeted regression
        run: node tests/agreement-signatory-schema-compat.test.js

      - name: Run regression suite
        run: npm test

      - name: Run syntax validation
        run: npm run check:syntax

      - name: Commit patch
        run: |
          if git diff --quiet -- supabase-data.js; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-data.js
          git commit -m 'fix: stop writing legacy agreement signatory alias'
          git push origin HEAD:main
