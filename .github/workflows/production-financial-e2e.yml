name: InCheck360 Production Financial E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to execute the production financial E2E test'
        required: true
        default: 'RUN'
  push:
    branches:
      - main
    paths:
      - 'scripts/production-financial-e2e-runner.js'
      - '.github/workflows/production-financial-e2e.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  production-financial-e2e:
    name: Production financial E2E
    if: github.event_name == 'push' || github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      E2E_WRITE_CONFIRM: RUN
      TEST_APP_URL: ${{ secrets.TEST_APP_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production financial E2E
        run: npm run test:production:financial

      - name: Upload financial E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: incheck360-production-financial-e2e-${{ github.run_number }}
          path: test-results/production-write-e2e.json
          if-no-files-found: warn
          retention-days: 14
