name: Remove SFC agreement signatures

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-sfc-signatures.yml'
      - 'scripts/remove-sfc-signatures.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply migration
        run: python scripts/remove-sfc-signatures.py

      - name: Syntax check
        run: |
          node --check agreements.js
          node --check clients-service.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agreements.js clients-service.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove SFC from agreement signatures"
          git push origin main
