name: One-time Fix Commission Salespeople

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-commission-salespeople.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Commission Tracker salesperson loading
        shell: python
        run: |
          from pathlib import Path

          commission = Path('commission-tracker.js')
          text = commission.read_text(encoding='utf-8')

          old_query = "db.from('profiles').select('id,name,email,username,role_key,is_active,active').limit(2000)"
          new_query = "db.from('profiles').select('id,name,email,username,role_key,is_active').limit(2000)"
          if old_query not in text:
              raise SystemExit('Expected stale profiles select was not found.')
          text = text.replace(old_query, new_query, 1)

          old_active = "const active=row.is_active!==false && row.active!==false;"
          new_active = "const active=row.is_active!==false;"
          if old_active not in text:
              raise SystemExit('Expected stale active-profile check was not found.')
          text = text.replace(old_active, new_active, 1)

          old_fallback = "if(!salespeople.length) salespeople=profiles.filter(row=>row.is_active!==false && row.active!==false);"
          new_fallback = "if(!salespeople.length) salespeople=profiles.filter(row=>row.is_active!==false);"
          if old_fallback not in text:
              raise SystemExit('Expected stale salesperson fallback was not found.')
          text = text.replace(old_fallback, new_fallback, 1)
          commission.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_cache = '/commission-tracker.js?v=20260730-custom-rate-persistence-v36'
          new_cache = '/commission-tracker.js?v=20260817-salesperson-profile-fix-v37'
          if old_cache not in html:
              raise SystemExit('Expected Commission Tracker cache key was not found.')
          index.write_text(html.replace(old_cache, new_cache, 1), encoding='utf-8')

          test = Path('tests/commission-salesperson-dropdown.test.js')
          test.write_text("""const assert = require('assert');
          const fs = require('fs');

          const source = fs.readFileSync('commission-tracker.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');

          assert(source.includes("select('id,name,email,username,role_key,is_active')"), 'Commission Tracker must query only deployed profile columns');
          assert(!source.includes('is_active,active'), 'Commission Tracker must not request the removed profiles.active column');
          assert(source.includes("['head_of_sales','sales_executive','sales_manager']"), 'Head of Sales must remain an eligible salesperson role');
          assert(!source.includes('row.active!==false'), 'Salesperson eligibility must use profiles.is_active as the source of truth');
          assert(index.includes('/commission-tracker.js?v=20260817-salesperson-profile-fix-v37'), 'Commission Tracker cache key must be bumped');

          console.log('Commission salesperson dropdown regression checks passed.');
          """, encoding='utf-8')

      - name: Focused regression
        run: node tests/commission-salesperson-dropdown.test.js

      - name: Full validation
        run: npm run check

      - name: Commit tested fix and remove helper
        run: |
          rm -f .github/workflows/one-time-fix-commission-salespeople.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commission-tracker.js index.html tests/commission-salesperson-dropdown.test.js .github/workflows/one-time-fix-commission-salespeople.yml
          git commit -m "fix: populate commission salesperson dropdown"
          git push origin HEAD:main
