name: One-time Credit Note DB Credential Check

on:
  push:
    branches:
      - repair/credit-note-rls-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          present() { if [ -n "$2" ]; then echo "$1=yes"; else echo "$1=no"; fi; }
          present SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          present SUPABASE_DB_URL "$SUPABASE_DB_URL"
          present DATABASE_URL "$DATABASE_URL"
          present SUPABASE_DB_PASSWORD "$SUPABASE_DB_PASSWORD"
          present SUPABASE_PROJECT_REF "$SUPABASE_PROJECT_REF"
          present TEST_SUPABASE_URL "$TEST_SUPABASE_URL"
          present TEST_SUPABASE_SERVICE_ROLE_KEY "$TEST_SUPABASE_SERVICE_ROLE_KEY"

      - name: Inspect existing RPC surface for safe DB administration helper
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$TEST_SUPABASE_URL" | tr -d '\r\n\t ' | sed 's:/*$::')"
          curl -fsS "$BASE_URL/rest/v1/" \
            -H "apikey: $TEST_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $TEST_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/openapi+json" > /tmp/openapi.json
          echo "Candidate RPCs:"
          jq -r '.paths | keys[] | select(startswith("/rpc/")) | sub("^/rpc/"; "")' /tmp/openapi.json \
            | grep -Ei '(sql|query|execute|exec|admin|migration|migrate|ddl|policy|credit|financial)' \
            | sort -u || true
