name: One-time Credit Note DB Credential Check

on:
  push:
    branches:
      - repair/credit-note-rls-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Inspect live credit-note schema
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$TEST_SUPABASE_URL" | tr -d '\r\n\t ' | sed 's:/*$::')"
          curl -fsS "$BASE_URL/rest/v1/" \
            -H "apikey: $TEST_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $TEST_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/openapi+json" > /tmp/openapi.json
          echo "Invoice required fields:"
          jq -c '.definitions.invoices.required // []' /tmp/openapi.json
          echo "Credit note required fields:"
          jq -c '.definitions.credit_notes.required // []' /tmp/openapi.json
          echo "Credit note properties:"
          jq -r '.definitions.credit_notes.properties | keys[]' /tmp/openapi.json | sort
          echo "Credit-related paths:"
          jq -r '.paths | keys[] | select(test("credit"; "i"))' /tmp/openapi.json | sort -u
