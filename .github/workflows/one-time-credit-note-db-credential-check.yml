name: One-time Credit Note DB Credential Check

on:
  push:
    branches:
      - repair/credit-note-rls-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Diagnose authenticated credit-note insert policy
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$TEST_SUPABASE_URL" | tr -d '\r\n\t ' | sed 's:/*$::')"
          ANON_KEY="$(printf '%s' "$TEST_SUPABASE_ANON_KEY" | tr -d '\r\n\t ')"
          SERVICE_KEY="$(printf '%s' "$TEST_SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n\t ')"
          EMAIL="$(printf '%s' "$TEST_USER_EMAIL" | tr -d '\r\n')"
          PASSWORD="$(printf '%s' "$TEST_USER_PASSWORD" | tr -d '\r\n')"
          TODAY="$(date -u +%F)"
          TEST_REF="CN-RLS-TEST-$(date -u +%s)-$RANDOM"
          INVOICE_UUID=""

          cleanup() {
            set +e
            if [ -n "$INVOICE_UUID" ]; then
              curl -sS -X DELETE "$BASE_URL/rest/v1/credit_notes?invoice_id=eq.$INVOICE_UUID" \
                -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" >/dev/null 2>&1 || true
              curl -sS -X DELETE "$BASE_URL/rest/v1/invoices?id=eq.$INVOICE_UUID" \
                -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          AUTH_PAYLOAD=$(jq -nc --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password}')
          AUTH_JSON=$(curl -fsS -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" -d "$AUTH_PAYLOAD")
          ACCESS_TOKEN=$(printf '%s' "$AUTH_JSON" | jq -r '.access_token // empty')
          USER_ID=$(printf '%s' "$AUTH_JSON" | jq -r '.user.id // empty')
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$USER_ID" ]; then
            echo "Unable to authenticate diagnostic user."
            exit 1
          fi

          ADMIN_RESULT=$(curl -fsS -X POST "$BASE_URL/rest/v1/rpc/crm_is_admin_user" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d '{}' || true)
          echo "crm_is_admin_user=$ADMIN_RESULT"

          INVOICE_PAYLOAD=$(jq -nc \
            --arg ref "$TEST_REF" --arg today "$TODAY" --arg uid "$USER_ID" \
            '{invoice_id:$ref,invoice_number:$ref,payment_schedule_mode:"auto",subtotal_locations:100,subtotal_one_time:0,invoice_total:100,is_poc:false,old_paid_total:0,paid_now:0,amount_paid:0,received_amount:0,credit_note_amount:0,pending_amount:100,balance_due:100,status:"issued",is_renewal:false,currency:"USD",issue_date:$today,due_date:$today,payment_term:"Net 30",billing_frequency:"Annually",customer_name:"Credit Note RLS Diagnostic",company_name:"Credit Note RLS Diagnostic",created_by:$uid,updated_by:$uid}')
          INVOICE_JSON=$(curl -fsS -X POST "$BASE_URL/rest/v1/invoices?select=id,invoice_id,invoice_number" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "$INVOICE_PAYLOAD")
          INVOICE_UUID=$(printf '%s' "$INVOICE_JSON" | jq -r '.[0].id // .id // empty')
          if [ -z "$INVOICE_UUID" ]; then
            echo "Unable to create disposable invoice fixture."
            printf '%s\n' "$INVOICE_JSON"
            exit 1
          fi
          echo "Disposable invoice created."

          NEXT_CN=$(curl -fsS -X POST "$BASE_URL/rest/v1/rpc/next_credit_note_number" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r '.')
          echo "Using disposable credit-note number allocation."

          BASE_CN=$(jq -nc \
            --arg invoice "$INVOICE_UUID" --arg invoiceNo "$TEST_REF" --arg cn "$NEXT_CN" --arg today "$TODAY" --arg req "$TEST_REF-REQ" \
            '{invoice_id:$invoice,invoice_number:$invoiceNo,credit_note_id:$cn,credit_note_number:$cn,credit_note_date:$today,description:"Credit Note RLS diagnostic",currency:"USD",credit_amount:10,status:"issued",credit_note_request_key:$req}')

          CODE_A=$(curl -sS -o /tmp/cn-a.json -w '%{http_code}' -X POST "$BASE_URL/rest/v1/credit_notes?select=id,credit_note_number" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "$BASE_CN")
          echo "omit_created_by_http=$CODE_A"
          jq -c '{code,message,details,hint}' /tmp/cn-a.json 2>/dev/null || cat /tmp/cn-a.json
          curl -sS -X DELETE "$BASE_URL/rest/v1/credit_notes?invoice_id=eq.$INVOICE_UUID" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" >/dev/null || true

          NEXT_CN_2=$(curl -fsS -X POST "$BASE_URL/rest/v1/rpc/next_credit_note_number" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r '.')
          WITH_CREATOR=$(printf '%s' "$BASE_CN" | jq --arg uid "$USER_ID" --arg cn "$NEXT_CN_2" --arg req "$TEST_REF-REQ-2" '.created_by=$uid | .updated_by=$uid | .credit_note_id=$cn | .credit_note_number=$cn | .credit_note_request_key=$req')
          CODE_B=$(curl -sS -o /tmp/cn-b.json -w '%{http_code}' -X POST "$BASE_URL/rest/v1/credit_notes?select=id,credit_note_number" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "$WITH_CREATOR")
          echo "explicit_created_by_http=$CODE_B"
          jq -c '{code,message,details,hint}' /tmp/cn-b.json 2>/dev/null || cat /tmp/cn-b.json

          if [ "$CODE_A" = "201" ] || [ "$CODE_B" = "201" ]; then
            echo "At least one authenticated insert variant succeeded."
          else
            echo "Both authenticated insert variants failed. Database RLS policy requires migration alignment."
          fi
