name: InCheck360 Production Write E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to execute the production write E2E test'
        required: true
        default: 'RUN'
  push:
    branches:
      - main
    paths:
      - 'scripts/production-write-e2e.js'
      - 'scripts/production-write-e2e-runner.js'
      - '.github/workflows/production-write-e2e.yml'
      - 'database/bootstrap/10_concurrent_business_ids_and_note_log_compatibility.sql'
      - 'database/bootstrap/11_payment_forecast_rpc_restore.sql'
      - 'package.json'

permissions:
  contents: read

jobs:
  production-write-e2e:
    name: Production write E2E (${{ matrix.scenario }})
    if: github.event_name == 'push' || github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: annual
            billing_frequency: 'Annual'
            payment_term: 'Net 30'
            installments: 1
          - scenario: semi-annual
            billing_frequency: 'Semi-Annually'
            payment_term: 'Net 21'
            installments: 2
          - scenario: quarterly
            billing_frequency: 'Quarterly'
            payment_term: 'Net 14'
            installments: 4
          - scenario: monthly
            billing_frequency: 'Monthly'
            payment_term: 'Net 7'
            installments: 12

    env:
      E2E_WRITE_CONFIRM: RUN
      E2E_BILLING_FREQUENCY: ${{ matrix.billing_frequency }}
      E2E_PAYMENT_TERM: ${{ matrix.payment_term }}
      E2E_EXPECTED_INSTALLMENTS: ${{ matrix.installments }}
      TEST_APP_URL: ${{ secrets.TEST_APP_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare billing scenario diagnostics
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          frequency = os.environ['E2E_BILLING_FREQUENCY']
          scenario = Path('scripts/production-write-e2e.js')
          source = scenario.read_text()
          billing_marker = "billing_frequency: 'Annual',"
          if billing_marker not in source:
              raise SystemExit('E2E billing-frequency fixture marker is missing')
          source = source.replace(billing_marker, f"billing_frequency: '{frequency}',")
          scenario.write_text(source)

          runner = Path('scripts/production-write-e2e-runner.js')
          runner_source = runner.read_text()
          schedule_marker = "  const invoiceScheduleRows = Array.isArray(invoiceScheduleResponse.data) ? invoiceScheduleResponse.data : [];"
          if schedule_marker not in runner_source:
              raise SystemExit('E2E payment-schedule diagnostic marker is missing')
          diagnostic = schedule_marker + "\n  console.log('[E2E payment propagation]', JSON.stringify({ proposal_payment_term: created.proposal?.payment_term, proposal_billing_frequency: created.proposal?.billing_frequency, agreement_payment_term: created.agreement?.payment_term, agreement_billing_frequency: created.agreement?.billing_frequency, invoice_payment_term: persistedInvoice.payment_term, invoice_payment_terms: persistedInvoice.payment_terms, schedule_count: invoiceScheduleRows.length }));"
          runner.write_text(runner_source.replace(schedule_marker, diagnostic))
          PY

      - name: Run production write E2E
        run: npm run test:production:write

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: incheck360-production-write-e2e-${{ matrix.scenario }}-${{ github.run_number }}
          path: test-results/production-write-e2e.json
          if-no-files-found: warn
          retention-days: 14
