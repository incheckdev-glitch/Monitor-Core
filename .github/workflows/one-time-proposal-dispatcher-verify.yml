name: One-time Proposal Dispatcher Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-proposal-dispatcher-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify proposal create/update items through application dispatcher
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const crypto = require('crypto');
          const url = String(process.env.TEST_SUPABASE_URL || '').replace(/\/$/, '');
          const anon = process.env.TEST_SUPABASE_ANON_KEY || '';
          const service = process.env.TEST_SUPABASE_SERVICE_ROLE_KEY || '';
          const email = process.env.TEST_USER_EMAIL || '';
          const password = process.env.TEST_USER_PASSWORD || '';
          if (!url || !anon || !service || !email || !password) throw new Error('Required production test secrets are missing.');
          const userClient = createClient(url, anon, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
          const serviceClient = createClient(url, service, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
          const marker = `PROPOSAL-DISPATCH-${Date.now()}-${crypto.randomBytes(3).toString('hex')}`;
          let proposalId = '';
          (async () => {
            const { data: auth, error: authError } = await userClient.auth.signInWithPassword({ email, password });
            if (authError) throw authError;
            const { data: profile, error: profileError } = await userClient.from('profiles').select('id,role_key,is_active').eq('id', auth.user.id).single();
            if (profileError) throw profileError;
            if (String(profile.role_key || '').toLowerCase() !== 'admin') throw new Error('Configured production test user is not admin.');

            global.window = global;
            global.location = { hostname:'github-actions', origin:'' };
            global.navigator = { userAgent:'github-actions' };
            global.RUNTIME_CONFIG = { SUPABASE_URL:url, SUPABASE_ANON_KEY:anon };
            global.SupabaseClient = { getClient: () => userClient };
            global.Session = {
              role: () => profile.role_key,
              userId: () => auth.user.id,
              authContext: () => ({ role:profile.role_key, user:auth.user, profile, session:auth.session })
            };
            global.AdminOverride = { canOverride: () => true };
            global.AppPermissions = { baseMatrix:{}, canPerformAction: () => true };
            delete require.cache[require.resolve('../../supabase-data.js')];
            require('../../supabase-data.js');
            const dispatch = async (action, payload) => {
              const out = await global.SupabaseData.dispatch({ resource:'proposals', action, ...payload });
              if (!out?.handled) throw new Error(`Dispatcher did not handle proposals:${action}`);
              return out.data;
            };

            const today = new Date().toISOString().slice(0,10);
            const end = new Date(Date.now() + 365*86400000).toISOString().slice(0,10);
            const items = [
              { item_id:`${marker}-SAAS`, section:'annual_saas', line_no:1, location_name:'Test Location', item_name:'Test SaaS', unit_price:825, discount_percent:0, discounted_unit_price:825, quantity:12, license_quantity:1, line_total:825, service_start_date:today, service_end_date:end },
              { item_id:`${marker}-SETUP`, section:'one_time_fee', line_no:2, location_name:'Test Location', item_name:'Account Setup', unit_price:200, discount_percent:0, discounted_unit_price:200, quantity:1, license_quantity:1, line_total:200 }
            ];
            const created = await dispatch('create', {
              proposal: { proposal_id:`PR-${Date.now()}`, ref_number:String(Date.now()), proposal_title:marker, proposal_date:today, valid_until:new Date(Date.now()+14*86400000).toISOString().slice(0,10), proposal_valid_until:new Date(Date.now()+14*86400000).toISOString().slice(0,10), currency:'USD', billing_frequency:'Annual', payment_term:'Net 30', status:'draft', subtotal_locations:825, subtotal_one_time:200, total_discount:0, grand_total:1025 },
              items
            });
            proposalId = String(created?.id || created?.proposal?.id || '').trim();
            if (!proposalId) throw new Error('Dispatcher create did not return proposal UUID.');
            const afterCreate = await userClient.from('proposal_items').select('id,proposal_id,item_name,line_total').eq('proposal_id', proposalId).order('line_no');
            if (afterCreate.error) throw afterCreate.error;
            if ((afterCreate.data || []).length !== 2) throw new Error(`Create persisted ${(afterCreate.data || []).length}/2 items.`);
            console.log('dispatcher create items: PASS 2/2');

            const updatedItems = items.map((item, index) => index === 0 ? { ...item, unit_price:850, discounted_unit_price:850, line_total:850 } : item);
            await dispatch('update', {
              id: proposalId,
              updates: { proposal_title:`${marker}-UPDATED`, subtotal_locations:850, subtotal_one_time:200, total_discount:0, grand_total:1050, status:'draft' },
              items: updatedItems
            });
            const afterUpdate = await userClient.from('proposal_items').select('id,proposal_id,item_name,unit_price,line_total').eq('proposal_id', proposalId).order('line_no');
            if (afterUpdate.error) throw afterUpdate.error;
            if ((afterUpdate.data || []).length !== 2) throw new Error(`Update persisted ${(afterUpdate.data || []).length}/2 items.`);
            const saas = (afterUpdate.data || []).find(row => row.item_name === 'Test SaaS');
            if (Number(saas?.unit_price) !== 850 || Number(saas?.line_total) !== 850) throw new Error('Updated SaaS item values were not persisted.');
            console.log('dispatcher Admin Draft update items: PASS 2/2');
          })().catch(error => { console.error(error); process.exitCode = 1; }).finally(async () => {
            if (proposalId) {
              await serviceClient.from('proposal_items').delete().eq('proposal_id', proposalId);
              await serviceClient.from('proposals').delete().eq('id', proposalId);
            }
            console.log('fixture cleanup: complete');
          });
          NODE
