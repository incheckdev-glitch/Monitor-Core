name: One-time Friendly Commercial IDs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-friendly-commercial-ids.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Standardize commercial business IDs
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(src, oldText, newText, label) {
            if (!src.includes(oldText)) throw new Error(`${label} marker not found`);
            return src.replace(oldText, newText);
          }

          // LEADS: Lead#00001
          {
            const path = 'leads.js';
            let src = fs.readFileSync(path, 'utf8');
            const oldGenerator = `  generateLeadId() {\n    const now = new Date();\n    const yyyy = String(now.getFullYear());\n    const mm = String(now.getMonth() + 1).padStart(2, '0');\n    const dd = String(now.getDate()).padStart(2, '0');\n    const rand = Math.random().toString(36).slice(2, 6).toUpperCase();\n    return \`LEAD-\${yyyy}\${mm}\${dd}-\${Date.now()}-\${rand}\`;\n  },`;
            const newGenerator = `  generateLeadId() {\n    const maxLocal = (Array.isArray(this.state.rows) ? this.state.rows : []).reduce((max, row) => {\n      const match = String(row?.lead_id || '').trim().match(/^Lead#(\\d+)$/i);\n      return match ? Math.max(max, Number(match[1]) || 0) : max;\n    }, 0);\n    return \`Lead#\${String(maxLocal + 1).padStart(5, '0')}\`;\n  },\n  async allocateLeadId() {\n    const client = this.getClient();\n    if (!client) return this.generateLeadId();\n    const { data, error } = await client\n      .from('leads')\n      .select('lead_id')\n      .ilike('lead_id', 'Lead#%')\n      .order('lead_id', { ascending: false })\n      .limit(100);\n    if (error) throw this.toSupabaseError ? this.toSupabaseError('Unable to allocate Lead ID', error) : error;\n    const maxDb = (Array.isArray(data) ? data : []).reduce((max, row) => {\n      const match = String(row?.lead_id || '').trim().match(/^Lead#(\\d+)$/i);\n      return match ? Math.max(max, Number(match[1]) || 0) : max;\n    }, 0);\n    return \`Lead#\${String(maxDb + 1).padStart(5, '0')}\`;\n  },`;
            src = replaceOnce(src, oldGenerator, newGenerator, 'Lead generator');
            src = src.replace(`lead_id: String(lead?.lead_id || '').trim() || this.generateLeadId()`, `lead_id: String(lead?.lead_id || '').trim() || await this.allocateLeadId()`);
            src = src.replace(`const tempLeadId = String(lead.lead_id || '').trim() || this.generateLeadId();`, `const tempLeadId = String(lead.lead_id || '').trim() || await this.allocateLeadId();`);
            fs.writeFileSync(path, src);
          }

          // DEALS: Deal#00001
          {
            const path = 'deals.js';
            let src = fs.readFileSync(path, 'utf8');
            const oldGenerator = `  generateDealId() {\n    const now = new Date();\n    const yyyy = String(now.getFullYear());\n    const mm = String(now.getMonth() + 1).padStart(2, '0');\n    const dd = String(now.getDate()).padStart(2, '0');\n    const rand = Math.random().toString(36).slice(2, 8).toUpperCase();\n    return \`DEAL-\${yyyy}\${mm}\${dd}-\${rand}\`;\n  },`;
            const newGenerator = `  generateDealId() {\n    const maxLocal = (Array.isArray(this.state.rows) ? this.state.rows : []).reduce((max, row) => {\n      const match = String(row?.deal_id || '').trim().match(/^Deal#(\\d+)$/i);\n      return match ? Math.max(max, Number(match[1]) || 0) : max;\n    }, 0);\n    return \`Deal#\${String(maxLocal + 1).padStart(5, '0')}\`;\n  },\n  async allocateDealId() {\n    const client = this.getClient();\n    if (!client) return this.generateDealId();\n    const { data, error } = await client\n      .from('deals')\n      .select('deal_id')\n      .ilike('deal_id', 'Deal#%')\n      .order('deal_id', { ascending: false })\n      .limit(100);\n    if (error) throw this.toSupabaseError ? this.toSupabaseError('Unable to allocate Deal ID', error) : error;\n    const maxDb = (Array.isArray(data) ? data : []).reduce((max, row) => {\n      const match = String(row?.deal_id || '').trim().match(/^Deal#(\\d+)$/i);\n      return match ? Math.max(max, Number(match[1]) || 0) : max;\n    }, 0);\n    return \`Deal#\${String(maxDb + 1).padStart(5, '0')}\`;\n  },`;
            src = replaceOnce(src, oldGenerator, newGenerator, 'Deal generator');
            const oldCreate = `  async createDeal(deal) {\n    const userId = await this.getCurrentUserId();\n    const payload = {\n      ...this.backendDeal(deal, { ensureDealId: true }),`;
            const newCreate = `  async createDeal(deal) {\n    const userId = await this.getCurrentUserId();\n    const dealWithBusinessId = {\n      ...(deal && typeof deal === 'object' ? deal : {}),\n      deal_id: String(deal?.deal_id || '').trim() || await this.allocateDealId()\n    };\n    const payload = {\n      ...this.backendDeal(dealWithBusinessId, { ensureDealId: false }),`;
            src = replaceOnce(src, oldCreate, newCreate, 'Deal create');
            fs.writeFileSync(path, src);
          }

          // PROPOSALS: Proposal#00001, same value for proposal_id and ref_number.
          {
            const path = 'proposals.js';
            let src = fs.readFileSync(path, 'utf8');
            const oldRef = `  generateRefNumber() {\n    return \`\${Date.now()}\${Math.floor(Math.random() * 1000)\n      .toString()\n      .padStart(3, '0')}\`;\n  },`;
            const newRef = `  generateRefNumber() {\n    return this.generateProposalId();\n  },`;
            src = replaceOnce(src, oldRef, newRef, 'Proposal ref generator');

            const oldGenerator = `  generateProposalId() {\n    const date = new Date();\n    const stamp = \`\${date.getFullYear()}\${String(date.getMonth() + 1).padStart(2, '0')}\${String(\n      date.getDate()\n    ).padStart(2, '0')}\`;\n    const suffix = Math.floor(Math.random() * 1000000)\n      .toString()\n      .padStart(6, '0');\n    return \`PR-\${stamp}-\${suffix}\`;\n  },`;
            const newGenerator = `  generateProposalId() {\n    const maxLocal = (Array.isArray(this.state.rows) ? this.state.rows : []).reduce((max, row) => {\n      const values = [row?.proposal_id, row?.ref_number];\n      for (const value of values) {\n        const match = String(value || '').trim().match(/^Proposal#(\\d+)$/i);\n        if (match) max = Math.max(max, Number(match[1]) || 0);\n      }\n      return max;\n    }, 0);\n    return \`Proposal#\${String(maxLocal + 1).padStart(5, '0')}\`;\n  },\n  async allocateProposalId() {\n    const client = this.getSupabaseClient?.() || window.SupabaseClient?.getClient?.();\n    if (!client) return this.generateProposalId();\n    let maxDb = 0;\n    for (const column of ['proposal_id', 'ref_number']) {\n      const { data, error } = await client\n        .from('proposals')\n        .select(column)\n        .ilike(column, 'Proposal#%')\n        .order(column, { ascending: false })\n        .limit(100);\n      if (error) throw new Error(\`Unable to allocate Proposal ID: \${error.message || error}\`);\n      for (const row of (Array.isArray(data) ? data : [])) {\n        const match = String(row?.[column] || '').trim().match(/^Proposal#(\\d+)$/i);\n        if (match) maxDb = Math.max(maxDb, Number(match[1]) || 0);\n      }\n    }\n    return \`Proposal#\${String(maxDb + 1).padStart(5, '0')}\`;\n  },`;
            src = replaceOnce(src, oldGenerator, newGenerator, 'Proposal generator');

            const oldCreate = `  async createProposal(proposal, items) {\n    const preparedProposal = this.buildProposalForPersist(proposal, items, { ensureBusinessProposalId: true });`;
            const newCreate = `  async createProposal(proposal, items) {\n    const friendlyId = await this.allocateProposalId();\n    const proposalWithBusinessId = {\n      ...(proposal && typeof proposal === 'object' ? proposal : {}),\n      proposal_id: friendlyId,\n      ref_number: friendlyId\n    };\n    const preparedProposal = this.buildProposalForPersist(proposalWithBusinessId, items, { ensureBusinessProposalId: true });`;
            src = replaceOnce(src, oldCreate, newCreate, 'Proposal create');
            fs.writeFileSync(path, src);
          }

          // Future database bootstrap should use the same Deal#NNNNN convention.
          {
            const path = 'database/bootstrap/12_gap_safe_business_id_allocation.sql';
            let src = fs.readFileSync(path, 'utf8');
            src = src.replace('-- Lead -> Deal: DEAL/YYYY/NNNN', '-- Lead -> Deal: Deal#NNNNN');
            src = src.replace(`  v_year text := to_char(current_date, 'YYYY');\n  v_seq bigint;`, `  v_seq bigint;`);
            src = src.replace(
              `  select coalesce(max((regexp_match(deal_id, '^DEAL/' || v_year || '/([0-9]+)$', 'i'))[1]::bigint), 0) + 1\n    into v_seq\n    from public.deals\n   where deal_id ~* ('^DEAL/' || v_year || '/[0-9]+$');\n\n  v_code := 'DEAL/' || v_year || '/' || lpad(v_seq::text, 4, '0');`,
              `  select coalesce(max((regexp_match(deal_id, '^Deal#([0-9]+)$', 'i'))[1]::bigint), 0) + 1\n    into v_seq\n    from public.deals\n   where deal_id ~* '^Deal#[0-9]+$';\n\n  v_code := 'Deal#' || lpad(v_seq::text, 5, '0');`
            );
            fs.writeFileSync(path, src);
          }

          const test = `const assert = require('assert');\nconst fs = require('fs');\n\nconst leads = fs.readFileSync('leads.js', 'utf8');\nconst deals = fs.readFileSync('deals.js', 'utf8');\nconst proposals = fs.readFileSync('proposals.js', 'utf8');\nconst migration = fs.readFileSync('database/bootstrap/12_gap_safe_business_id_allocation.sql', 'utf8');\n\nassert.match(leads, /Lead#\\$\\{String\\(maxDb \\+ 1\\)\\.padStart\\(5, '0'\\)\\}/, 'Lead IDs must be friendly sequential IDs');\nassert.match(leads, /await this\\.allocateLeadId\\(\\)/, 'Lead create must allocate from database state');\nassert.doesNotMatch(leads, /LEAD-\\$\\{yyyy\\}\\$\\{mm\\}\\$\\{dd\\}/, 'timestamp Lead IDs must be removed');\n\nassert.match(deals, /Deal#\\$\\{String\\(maxDb \\+ 1\\)\\.padStart\\(5, '0'\\)\\}/, 'Deal IDs must be friendly sequential IDs');\nassert.match(deals, /await this\\.allocateDealId\\(\\)/, 'Deal create must allocate from database state');\nassert.doesNotMatch(deals, /DEAL-\\$\\{yyyy\\}\\$\\{mm\\}\\$\\{dd\\}/, 'timestamp Deal IDs must be removed');\n\nassert.match(proposals, /Proposal#\\$\\{String\\(maxDb \\+ 1\\)\\.padStart\\(5, '0'\\)\\}/, 'Proposal IDs must be friendly sequential IDs');\nassert.match(proposals, /proposal_id: friendlyId,[\\s\\S]*ref_number: friendlyId/, 'Proposal ID and ref number must use the same friendly ID');\nassert.doesNotMatch(proposals, /return \\`PR-\\$\\{stamp\\}-\\$\\{suffix\\}\\`/, 'timestamp Proposal IDs must be removed');\nassert.match(migration, /v_code := 'Deal#' \\|\\| lpad\\(v_seq::text, 5, '0'\\)/, 'DB bootstrap Deal conversion must use Deal#NNNNN');\nassert.match(migration, /v_id := 'Proposal#' \\|\\| lpad\\(v_seq::text, 5, '0'\\)/, 'DB bootstrap Proposal conversion must use Proposal#NNNNN');\n\nconsole.log('friendly commercial ID regressions passed');\n`;
          fs.writeFileSync('tests/friendly-commercial-ids.test.js', test);
          NODE

      - name: Validate changes
        run: |
          node --check leads.js
          node --check deals.js
          node --check proposals.js
          node tests/friendly-commercial-ids.test.js
          npm ci
          npm run check

      - name: Commit standardization
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git add leads.js deals.js proposals.js database/bootstrap/12_gap_safe_business_id_allocation.sql tests/friendly-commercial-ids.test.js
          git commit -m "fix: use friendly commercial business IDs"
          git push origin main
