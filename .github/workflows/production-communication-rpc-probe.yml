name: Communication Centre RPC Probe

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/production-communication-rpc-probe.js'
      - '.github/workflows/production-communication-rpc-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Probe Communication Centre RPCs
        run: node scripts/production-communication-rpc-probe.js
