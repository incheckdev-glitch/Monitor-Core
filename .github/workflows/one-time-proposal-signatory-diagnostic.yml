name: One-time Proposal Signatory Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-proposal-signatory-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correct and verify authenticated profile identity
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const url = process.env.TEST_SUPABASE_URL;
          const anon = process.env.TEST_SUPABASE_ANON_KEY;
          const email = process.env.TEST_USER_EMAIL;
          const password = process.env.TEST_USER_PASSWORD;
          if (!url || !anon || !email || !password) throw new Error('Missing production test credentials');
          (async () => {
            const client = createClient(url, anon, { auth: { persistSession: false, autoRefreshToken: false } });
            const { data: authData, error: authError } = await client.auth.signInWithPassword({ email, password });
            if (authError) throw authError;
            const userId = authData?.user?.id;
            if (!userId) throw new Error('Authenticated user id is missing');
            const { data: before, error: readError } = await client.from('profiles').select('id,name,email,username,role_key,is_active').eq('id', userId).single();
            if (readError) throw readError;
            const currentName = String(before?.name || '').trim();
            if (currentName !== 'Khaled Yakan') {
              const { error: updateError } = await client.from('profiles').update({ name: 'Khaled Yakan' }).eq('id', userId);
              if (updateError) throw updateError;
            }
            const { data: after, error: verifyError } = await client.from('profiles').select('id,name,email,username,role_key,is_active').eq('id', userId).single();
            if (verifyError) throw verifyError;
            if (String(after?.name || '').trim() !== 'Khaled Yakan') throw new Error('Profile name correction did not persist');
            console.log('PROFILE_NAME_VERIFIED', JSON.stringify({ name: after.name, role_key: after.role_key || '', is_active: after.is_active !== false }));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
