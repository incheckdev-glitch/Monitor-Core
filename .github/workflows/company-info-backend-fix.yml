name: Complete UAE company info backend migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/company-info-backend-fix.yml

permissions:
  contents: write

jobs:
  update-backend-company-info:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align backend and agreement legal text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              'supabase-data.js': [
                  ("name: 'InCheck 360 Holding BV'", "name: 'Incheck 360 FZC'"),
                  ('InCheck 360 Holding B.V.', 'Incheck 360 FZC.')
              ],
              'agreements.js': [
                  ('and Incheck 360 FZC\n\nIN WITNESS', 'and Incheck 360 FZC.\n\nIN WITNESS')
              ],
              'tests/agreement-conversion-terms.test.js': [
                  ('and Incheck 360 FZC\n\nIN WITNESS', 'and Incheck 360 FZC.\n\nIN WITNESS')
              ]
          }

          for filename, pairs in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      print(f'WARNING: expected text not found in {filename}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated {filename}')
              else:
                  print(f'No changes required in {filename}')
          PY

      - name: Commit backend company info update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-data.js agreements.js tests/agreement-conversion-terms.test.js
          if git diff --cached --quiet; then
            echo "No backend company information changes to commit."
            exit 0
          fi
          git commit -m "Complete company legal information migration"
          git push