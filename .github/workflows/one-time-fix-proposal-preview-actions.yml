name: One-time Fix Proposal Preview Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-proposal-preview-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch proposal preview
        run: |
          python3 .github/scripts/patch-proposal-preview.py
          python3 .github/scripts/fix-proposal-preview-test.py
      - name: Focused validation
        run: |
          node --check proposals.js
          node tests/proposal-preview-actions.test.js
      - name: Full validation
        run: npm run check
      - name: Commit fix
        run: |
          git config user.name "incheckdev-glitch"
          git config user.email "incheckdev@gmail.com"
          git add proposals.js index.html tests/proposal-preview-actions.test.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair proposal preview actions and signatory name"
          git push origin HEAD:main
