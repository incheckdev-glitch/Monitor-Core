name: One-time Fix Communication Message Mutation

# Rerun after invoice cache-version regression was made forward-compatible.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-communication-message-mutation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch secure Communication message mutation path
        shell: python
        run: |
          from pathlib import Path
          import re

          supabase = Path('supabase-data.js')
          text = supabase.read_text(encoding='utf-8')
          direct_pattern = re.compile(
              r"      const \{ data, error \} = await client\.from\('communication_centre_messages'\)\.update\(updates\)\.eq\('id', id\)\.select\('\*'\)\.single\(\);\n"
              r"      if \(error\) throw friendlyError\(action === 'update_message' \? 'Unable to edit message' : 'Unable to delete message', error\);\n"
              r"      return \{ handled: true, data \};"
          )
          replacement = """      if (action === 'update_message') {
            const messageBody = allowedTextFields
              .map(field => updates[field])
              .find(value => typeof value === 'string' && value.trim());
            const { data, error } = await client.rpc('edit_communication_centre_message_secure', {
              p_message_id: id,
              p_message_body: String(messageBody || '').trim()
            });
            if (error) throw friendlyError('Unable to edit message', error);
            return { handled: true, data: Array.isArray(data) ? data[0] : data };
          }
          const { data, error } = await client.rpc('soft_delete_communication_centre_message_secure', {
            p_message_id: id
          });
          if (error) throw friendlyError('Unable to delete message', error);
          return { handled: true, data: Array.isArray(data) ? data[0] : data };"""
          text, count = direct_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one direct Communication message UPDATE block, found {count}.')
          supabase.write_text(text, encoding='utf-8')

          diagnostic = Path('scripts/production-communication-diagnostic.js')
          script = diagnostic.read_text(encoding='utf-8')
          edit_pattern = re.compile(
              r"  const editedBody = `\$\{marker\} reply updated`;\n"
              r"  const edited = await userClient\.from\('communication_centre_messages'\)\.update\(\{\n"
              r"    message_body: editedBody,\n"
              r"    edited_at: new Date\(\)\.toISOString\(\),\n"
              r"    edited_by: user\.id\n"
              r"  \}\)\.eq\('id', messageId\)\.select\('id,message_body,edited_at'\)\.single\(\);\n"
              r"  if \(edited\.error\) throw edited\.error;\n"
              r"  if \(edited\.data\?\.message_body !== editedBody\) throw new Error\('Authenticated message edit did not persist\.'\);\n"
              r"  pass\('Authenticated Communication message edit', String\(messageId\)\);"
          )
          edit_replacement = """  const editedBody = `${marker} reply updated`;
          const edited = await userClient.rpc('edit_communication_centre_message_secure', {
            p_message_id: messageId,
            p_message_body: editedBody
          });
          if (edited.error) throw edited.error;
          const editedRow = Array.isArray(edited.data) ? edited.data[0] : edited.data;
          if (editedRow?.message_body !== editedBody) throw new Error('Secure message edit did not persist.');
          pass('Secure Communication message edit', String(messageId));"""
          script, count = edit_pattern.subn(edit_replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one direct diagnostic message edit block, found {count}.')

          reopen_anchor = "  pass('Reopen Communication conversation', 'Open');"
          if reopen_anchor not in script:
              raise SystemExit('Expected reopen diagnostic anchor was not found.')
          delete_check = """  pass('Reopen Communication conversation', 'Open');

          const deleted = await userClient.rpc('soft_delete_communication_centre_message_secure', { p_message_id: messageId });
          if (deleted.error) throw deleted.error;
          const deletedRow = Array.isArray(deleted.data) ? deleted.data[0] : deleted.data;
          if (deletedRow?.is_deleted !== true) throw new Error('Secure message soft delete did not persist.');
          pass('Secure Communication message soft delete', String(messageId));"""
          script = script.replace(reopen_anchor, delete_check, 1)
          diagnostic.write_text(script, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_cache = '/supabase-data.js?v=20260817-invoice-business-id-v1'
          new_cache = '/supabase-data.js?v=20260817-communication-message-rpc-v2'
          if old_cache not in html:
              raise SystemExit('Expected SupabaseData cache key was not found.')
          index.write_text(html.replace(old_cache, new_cache, 1), encoding='utf-8')

          test = Path('tests/communication-message-secure-mutation.test.js')
          test.write_text("""const assert = require('assert');
          const fs = require('fs');

          const source = fs.readFileSync('supabase-data.js', 'utf8');
          const diagnostic = fs.readFileSync('scripts/production-communication-diagnostic.js', 'utf8');
          const migration = fs.readFileSync('database/bootstrap/20_communication_centre_secure_message_mutation.sql', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');

          assert(source.includes("rpc('edit_communication_centre_message_secure'"), 'Communication edits must use secure RPC');
          assert(source.includes("rpc('soft_delete_communication_centre_message_secure'"), 'Communication deletes must use secure RPC');
          assert(!source.includes("from('communication_centre_messages').update(updates).eq('id', id).select('*').single()"), 'Communication message mutation must not use direct table UPDATE');
          assert(diagnostic.includes("rpc('edit_communication_centre_message_secure'"), 'Production diagnostic must verify secure edit RPC');
          assert(diagnostic.includes("rpc('soft_delete_communication_centre_message_secure'"), 'Production diagnostic must verify secure delete RPC');
          assert(migration.includes("interval '5 minutes'"), 'Secure mutation RPCs must enforce the five-minute window');
          assert(migration.includes('v_message.sender_id is distinct from v_actor'), 'Secure mutation RPCs must enforce sender ownership');
          assert(index.includes('/supabase-data.js?v=20260817-communication-message-rpc-v2'), 'SupabaseData cache key must be bumped');

          console.log('Communication secure message mutation checks passed.');
          """, encoding='utf-8')

      - name: Focused regression
        run: node tests/communication-message-secure-mutation.test.js

      - name: Full validation
        run: npm run check

      - name: Commit tested fix and remove helper
        run: |
          rm -f .github/workflows/one-time-fix-communication-message-mutation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-data.js scripts/production-communication-diagnostic.js index.html tests/communication-message-secure-mutation.test.js database/bootstrap/20_communication_centre_secure_message_mutation.sql .github/workflows/one-time-fix-communication-message-mutation.yml
          git commit -m "fix: secure communication message mutations"
          git push origin HEAD:main
