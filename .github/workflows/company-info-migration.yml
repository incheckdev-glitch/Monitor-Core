name: Apply UAE company legal information

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/company-info-migration.yml

permissions:
  contents: write

jobs:
  update-company-info:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update legal company information
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          company = {
              "company_name": "Incheck 360 FZC",
              "formation_type": "Free Zone Company",
              "formation_number": "4431674",
              "license_number": "4431674.01",
              "company_address": "Business Centre, Sharjah Publishing City Free Zone, Sharjah, United Arab Emirates",
              "license_formation_date": "03/09/2026",
              "license_expiry_date": "02/09/2027",
              "manager": "Vanessa Georges Wazen",
              "issuing_authority": "Sharjah Publishing City - Free Zone Authority",
              "country": "United Arab Emirates",
              "contact_email": "info@incheck360.nl",
              "contact_mobile": "+31 97 010280855",
              "activities": [
                  {"code": "4791", "name": "Retail Sale Via Mail Order Houses or Via internet (E-Commerce)"},
                  {"code": "4791.05", "name": "Retail Sale of Any Kind of Product Over the Internet, Selling IT Solutions Over the Internet"},
                  {"code": "5820", "name": "Software publishing"},
                  {"code": "6201", "name": "Computer programming activities"},
                  {"code": "6201.01", "name": "Designing software, applications, databases and web pages"},
                  {"code": "6201.02", "name": "Customizing of software"},
                  {"code": "6209.15", "name": "Innovation and artificial intelligence research and consultancies"},
                  {"code": "6209.22", "name": "IT Consultancy, IT Services"},
                  {"code": "6311.02", "name": "Specialized hosting activities"},
                  {"code": "6311.03", "name": "Application service provisioning"},
                  {"code": "6311.08", "name": "Data Classification & Analysis Services"},
                  {"code": "6311.18", "name": "Electronic Integration"}
              ]
          }

          replacements = {
              "proposals.js": [
                  ("name: 'InCheck 360 Holding BV'", "name: 'Incheck 360 FZC'"),
                  ("address: 'Pyrmontstraat 5, 7513 BN, Enschede, The Netherlands'", "address: 'Business Centre, Sharjah Publishing City Free Zone, Sharjah, United Arab Emirates'")
              ],
              "agreements.js": [
                  ("InCheck 360 Holding B.V.", "Incheck 360 FZC"),
                  ("legalName: 'InCheck 360 Holding BV'", "legalName: 'Incheck 360 FZC'"),
                  ("name: 'InCheck 360 Holding BV'", "name: 'Incheck 360 FZC'"),
                  ("address: 'Pyrmontstraat 5, 7513 BN, Enschede, The Netherlands'", "address: 'Business Centre, Sharjah Publishing City Free Zone, Sharjah, United Arab Emirates'"),
                  ("contactName: 'InCheck 360 Holding BV'", "contactName: 'Incheck 360 FZC'")
              ],
              "accounting.js": [
                  ("<strong>InCheck 360 Holding BV</strong>Pyrmontstraat 5, 7513 BN, Enschede, Netherlands<br>info@incheck360.nl", "<strong>Incheck 360 FZC</strong>Business Centre, Sharjah Publishing City Free Zone, Sharjah, United Arab Emirates<br>License No. 4431674.01<br>info@incheck360.nl")
              ],
              "tests/agreement-conversion-terms.test.js": [
                  ("InCheck 360 Holding B.V.", "Incheck 360 FZC")
              ]
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      print(f"WARNING: expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"Updated {filename}")
              else:
                  print(f"No changes required in {filename}")

          Path("company-info.json").write_text(
              json.dumps(company, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          print("Wrote company-info.json")
          PY

      - name: Commit company information update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals.js agreements.js accounting.js tests/agreement-conversion-terms.test.js company-info.json
          if git diff --cached --quiet; then
            echo "No company information changes to commit."
            exit 0
          fi
          git commit -m "Update company legal information to Incheck 360 FZC"
          git push