name: InCheck360 Non-Commercial Write E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to execute the production non-commercial write E2E test'
        required: true
        default: 'RUN'
  push:
    branches:
      - main
    paths:
      - 'scripts/production-noncommercial-write-e2e.js'
      - '.github/workflows/production-noncommercial-write-e2e.yml'
      - 'tickets.js'
      - 'calendar.js'
      - 'client-success.js'
      - 'communication-centre.js'
      - 'supabase-data.js'
      - 'permissions.js'
      - 'database/seeds/01_roles_and_permissions.sql'
      - 'package.json'

permissions:
  contents: read

jobs:
  production-noncommercial-write-e2e:
    name: Non-commercial production write E2E
    if: github.event_name == 'push' || github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_WRITE_CONFIRM: RUN
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-commercial production write E2E
        run: node scripts/production-noncommercial-write-e2e.js

      - name: Upload non-commercial E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: incheck360-production-noncommercial-write-e2e-${{ github.run_number }}
          path: test-results/production-noncommercial-write-e2e.json
          if-no-files-found: warn
          retention-days: 14
