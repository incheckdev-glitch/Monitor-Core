name: InCheck360 Full Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-all:
    name: Full automated test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_APP_URL: ${{ secrets.TEST_APP_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all InCheck360 tests
        run: npm run test:all

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: incheck360-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
