name: InCheck360 Production Communication Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to execute the production Communication Centre diagnostic'
        required: true
        default: 'RUN'
  push:
    branches:
      - main
    paths:
      - 'scripts/production-communication-diagnostic.js'
      - 'api/communication-centre-create.js'
      - 'supabase-client.js'
      - 'communication-centre.js'
      - 'database/bootstrap/15_communication_centre_create_conversation_rpc.sql'
      - 'database/bootstrap/16_communication_centre_current_app_user_helper.sql'
      - '.github/workflows/production-communication-diagnostic.yml'

permissions:
  contents: read

jobs:
  production-communication-diagnostic:
    name: Production Communication Diagnostic
    if: github.event_name == 'push' || github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_WRITE_CONFIRM: RUN
      TEST_APP_URL: ${{ secrets.TEST_APP_URL }}
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production Communication Centre diagnostic
        run: node scripts/production-communication-diagnostic.js
